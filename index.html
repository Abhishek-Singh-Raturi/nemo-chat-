<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nemo - AI Assistant</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/atom-one-dark.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
</head>
<body>
    <div class="app-container">
        <!-- Sidebar -->
        <aside class="sidebar">
            <div class="sidebar-header">
                <div class="logo">
                    <div class="logo-icon">
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5"/>
                        </svg>
                    </div>
                    <span class="logo-text">Nemo</span>
                </div>
                <button class="icon-btn sidebar-toggle" aria-label="Toggle sidebar">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <rect x="3" y="3" width="18" height="18" rx="2"/>
                        <path d="M9 3v18"/>
                    </svg>
                </button>
            </div>

            <button class="new-chat-btn">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M12 5v14M5 12h14"/>
                </svg>
                New chat
            </button>

            <div class="search-box">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <circle cx="11" cy="11" r="8"/>
                    <path d="M21 21l-4.35-4.35"/>
                </svg>
                <input type="text" placeholder="Search..." aria-label="Search">
            </div>

            <!-- Tasks Section -->
            <div class="sidebar-section">
                <div class="section-header">
                    <h3>Tasks</h3>
                    <button class="add-task-btn" id="addTaskBtn">
                        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M12 5v14M5 12h14"/>
                        </svg>
                    </button>
                </div>
                <div class="tasks-list" id="tasksList"></div>
            </div>


            <!-- Calendar Section -->
            <div class="sidebar-section calendar-section">
                <button class="calendar-toggle-btn" id="calendarToggleBtn">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <rect x="3" y="4" width="18" height="18" rx="2" ry="2"/>
                        <line x1="16" y1="2" x2="16" y2="6"/>
                        <line x1="8" y1="2" x2="8" y2="6"/>
                        <line x1="3" y1="10" x2="21" y2="10"/>
                    </svg>
                    <span>Calendar</span>
                    <svg class="toggle-arrow" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M6 9l6 6 6-6"/>
                    </svg>
                </button>
                <div class="calendar-content" id="calendarContent" style="display: none;">
                    <div class="calendar">
                        <div class="calendar-header">
                            <button class="cal-nav-btn" id="prevMonth">
                                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                    <path d="M15 18l-6-6 6-6"/>
                                </svg>
                            </button>
                            <span class="cal-month" id="calMonth"></span>
                            <button class="cal-nav-btn" id="nextMonth">
                                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                    <path d="M9 18l6-6-6-6"/>
                                </svg>
                            </button>
                        </div>
                        <div class="calendar-days">
                            <span>Su</span><span>Mo</span><span>Tu</span><span>We</span><span>Th</span><span>Fr</span><span>Sa</span>
                        </div>
                        <div class="calendar-grid" id="calendarGrid"></div>
                    </div>
                    <div class="calendar-tasks" id="calendarTasks">
                        <div class="cal-tasks-header">
                            <span id="selectedDate">Today's Tasks</span>
                            <button class="add-task-btn" id="addTaskForDate">
                                <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                    <path d="M12 5v14M5 12h14"/>
                                </svg>
                            </button>
                        </div>
                        <div class="cal-tasks-list" id="calendarTasksList"></div>
                    </div>
                </div>
            </div>

            <!-- Chat History -->
            <div class="sidebar-section">
                <div class="section-header">
                    <h3>Recent Chats</h3>
                    <button class="delete-all-btn" id="deleteAllHistoryBtn" title="Delete all history">
                        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg>
                    </button>
                </div>
                <div class="chat-history" id="historyContainer">
                </div>
            </div>

        </aside>

        <!-- Main Content -->
        <main class="main-content">
            <!-- Header -->
            <header class="main-header">
                <div class="header-left">
                    <button class="icon-btn mobile-menu-btn" aria-label="Open menu">
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M3 12h18M3 6h18M3 18h18"/>
                        </svg>
                    </button>
                    <div class="model-selector">
                        <div class="model-icon"></div>
                        <span>Nemo</span>
                        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M6 9l6 6 6-6"/>
                        </svg>
                    </div>
                </div>
                <div class="header-right">
                    <button class="export-btn">
                        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
                            <polyline points="7 10 12 15 17 10"/>
                            <line x1="12" y1="15" x2="12" y2="3"/>
                        </svg>
                        Export
                    </button>
                    <div class="user-profile" id="userProfileBtn">
                        <div class="user-avatar" id="headerAvatar">J</div>
                        <span class="user-name" id="headerUserName">User</span>
                    </div>
                    <button class="theme-toggle-btn" aria-label="Toggle theme" id="themeToggle">
                        <svg class="sun-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <circle cx="12" cy="12" r="5"/>
                            <line x1="12" y1="1" x2="12" y2="3"/>
                            <line x1="12" y1="21" x2="12" y2="23"/>
                            <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/>
                            <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/>
                            <line x1="1" y1="12" x2="3" y2="12"/>
                            <line x1="21" y1="12" x2="23" y2="12"/>
                            <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/>
                            <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/>
                        </svg>
                        <svg class="moon-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>
                        </svg>
                        <svg class="anime-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14l-5-4.87 6.91-1.01L12 2z"/>
                        </svg>
                    </button>
                    <button class="icon-btn settings-btn" aria-label="Settings" id="settingsBtn">
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <circle cx="12" cy="12" r="3"/>
                            <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"/>
                        </svg>
                    </button>
                </div>
            </header>

            <!-- Chat Area -->
            <div class="chat-area">
                <div class="welcome-section">
                    <div class="welcome-avatar">
                        <div class="avatar-glow"></div>
                        <div class="nemo-eyes">
                            <div class="nemo-eye left">
                                <div class="nemo-pupil"></div>
                            </div>
                            <div class="nemo-eye right">
                                <div class="nemo-pupil"></div>
                            </div>
                        </div>
                    </div>
                    <h1 class="welcome-title">Hello, <span id="welcomeUserName">User</span></h1>
                    <h2 class="welcome-subtitle">How can I assist you today?</h2>
                </div>

                <div class="chat-messages"></div>

                <!-- Input Area -->
                <div class="input-section">
                    <div class="input-container glass-card">
                        <div class="image-preview-container" id="imagePreviewContainer" style="display: none;">
                            <div class="image-preview" id="imagePreview">
                                <img id="previewImage" src="" alt="Preview">
                                <button class="remove-image-btn" id="removeImageBtn">
                                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                        <line x1="18" y1="6" x2="6" y2="18"/>
                                        <line x1="6" y1="6" x2="18" y2="18"/>
                                    </svg>
                                </button>
                            </div>
                        </div>
                        <div class="input-wrapper">
                            <textarea 
                                class="chat-input" 
                                placeholder="Ask me anything..." 
                                rows="1"
                                aria-label="Chat input"
                            ></textarea>
                        </div>
                        <div class="input-actions">
                            <div class="input-actions-left">
                                <div class="model-dropdown" id="modelDropdown">
                                    <button class="action-btn model-selector-btn" id="modelSelectorBtn">
                                        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                            <path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5"/>
                                        </svg>
                                        <span id="currentModelName">Select Model</span>
                                        <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                            <path d="M6 9l6 6 6-6"/>
                                        </svg>
                                    </button>
                                </div>
                            </div>
                            <div class="input-actions-right">
                                <button class="icon-btn" aria-label="Attach image" id="attachImageBtn">
                                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                        <rect x="3" y="3" width="18" height="18" rx="2" ry="2"/>
                                        <circle cx="8.5" cy="8.5" r="1.5"/>
                                        <polyline points="21 15 16 10 5 21"/>
                                    </svg>
                                </button>
                                <input type="file" id="imageInput" accept="image/*" style="display: none;">
                                <button class="send-btn" aria-label="Send message">
                                    <div class="send-btn-inner">
                                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                            <line x1="22" y1="2" x2="11" y2="13"/>
                                            <polygon points="22 2 15 22 11 13 2 9 22 2"/>
                                        </svg>
                                    </div>
                                </button>
                            </div>
                        </div>
                    </div>

                    <div class="bottom-actions">
                    </div>
                </div>
            </div>
        </main>
    </div>

    <script src="script.js"></script>

    <!-- Settings Modal -->
    <div class="modal-overlay" id="settingsModal">
        <div class="modal glass-card">
            <div class="modal-header">
                <h2>Settings</h2>
                <button class="icon-btn close-modal" id="closeModal">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <line x1="18" y1="6" x2="6" y2="18"/>
                        <line x1="6" y1="6" x2="18" y2="18"/>
                    </svg>
                </button>
            </div>
            <div class="modal-tabs">
                <button class="modal-tab active" data-tab="profile">Profile</button>
                <button class="modal-tab" data-tab="api">API Settings</button>
            </div>
            <div class="modal-body">
                <!-- Profile Tab -->
                <div class="tab-content active" id="profileTab">
                    <div class="profile-avatar-section">
                        <div class="profile-avatar-large" id="profileAvatarLarge">
                            <span id="profileInitial">J</span>
                            <button class="change-avatar-btn" id="changeAvatarBtn">
                                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                    <rect x="3" y="3" width="18" height="18" rx="2" ry="2"/>
                                    <circle cx="8.5" cy="8.5" r="1.5"/>
                                    <polyline points="21 15 16 10 5 21"/>
                                </svg>
                            </button>
                            <input type="file" id="avatarInput" accept="image/*" style="display: none;">
                        </div>
                    </div>
                    <div class="form-group">
                        <label>Your Name</label>
                        <input type="text" id="userName" placeholder="User">
                    </div>
                    <div class="form-group">
                        <label>Bio (Optional)</label>
                        <textarea id="userBio" placeholder="AI enthusiast, developer..." rows="2"></textarea>
                    </div>
                    <button class="save-btn" id="saveProfileBtn">Save Profile</button>
                </div>

                <!-- API Tab -->
                <div class="tab-content" id="apiTab">
                    <div class="profiles-section">
                        <div class="profiles-header">
                            <label>API Profiles</label>
                            <button class="add-profile-btn" id="addProfileBtn">
                                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                    <path d="M12 5v14M5 12h14"/>
                                </svg>
                                Add
                            </button>
                        </div>
                        <div class="profiles-list" id="profilesList"></div>
                    </div>
                    <div class="profile-form" id="profileForm">
                        <div class="form-group">
                            <label>Profile Name</label>
                            <input type="text" id="profileName" placeholder="My OpenAI API">
                        </div>
                        <div class="form-group">
                            <label>API Provider</label>
                            <select id="apiProvider">
                                <option value="openai">OpenAI</option>
                                <option value="anthropic">Anthropic</option>
                                <option value="gemini">Google Gemini</option>
                                <option value="groq">Groq</option>
                                <option value="openrouter">OpenRouter</option>
                                <option value="custom">Custom</option>
                            </select>
                        </div>
                        <div class="form-group">
                            <label>API Key</label>
                            <div class="input-with-icon">
                                <input type="password" id="apiKey" placeholder="sk-...">
                                <button class="icon-btn toggle-password" id="togglePassword">
                                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                        <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
                                        <circle cx="12" cy="12" r="3"/>
                                    </svg>
                                </button>
                            </div>
                        </div>
                        <div class="form-group">
                            <div class="models-header">
                                <label>Models</label>
                                <button class="add-model-btn" id="addModelBtn">
                                    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                        <path d="M12 5v14M5 12h14"/>
                                    </svg>
                                    Add Model
                                </button>
                            </div>
                            <div class="models-list" id="modelsList"></div>
                        </div>
                        <div class="form-group">
                            <label>Custom URL (Optional)</label>
                            <input type="text" id="customUrl" placeholder="https://api.example.com/v1/chat/completions">
                        </div>
                        <div class="form-group">
                            <label>System Prompt</label>
                            <textarea id="systemPrompt" placeholder="You are Nemo..." rows="3"></textarea>
                        </div>
                        <div class="form-actions">
                            <button class="delete-profile-btn" id="deleteProfileBtn">Delete</button>
                            <button class="save-btn" id="saveSettings">Save</button>
                        </div>
                    </div>
                </div>

            </div>
        </div>
    </div>

    <!-- Add Model Modal -->
    <div class="modal-overlay" id="addModelModal">
        <div class="modal glass-card small-modal">
            <div class="modal-header">
                <h2>Add Model</h2>
                <button class="icon-btn close-modal" id="closeModelModal">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <line x1="18" y1="6" x2="6" y2="18"/>
                        <line x1="6" y1="6" x2="18" y2="18"/>
                    </svg>
                </button>
            </div>
            <div class="modal-body">
                <div class="form-group">
                    <label>Choose Provider</label>
                    <select id="modelProviderSelect">
                        <option value="">-- Select Provider --</option>
                        <option value="openai">OpenAI</option>
                        <option value="anthropic">Anthropic (Claude)</option>
                        <option value="gemini">Google Gemini</option>
                        <option value="groq">Groq</option>
                        <option value="openrouter">OpenRouter</option>
                        <option value="custom">Custom (Enter manually)</option>
                    </select>
                </div>
                <div class="predefined-models" id="predefinedModels"></div>
                <div class="custom-model-form" id="customModelForm" style="display:none;">
                    <div class="form-group">
                        <label>Model Name</label>
                        <input type="text" id="modelName" placeholder="My Custom Model">
                    </div>
                    <div class="form-group">
                        <label>Model ID</label>
                        <input type="text" id="modelId" placeholder="model-id-here">
                    </div>
                    <button class="save-btn" id="saveCustomModelBtn">Add This Model</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Delete Chat Modal -->
    <div class="modal-overlay" id="deleteChatModal">
        <div class="modal glass-card small-modal">
            <div class="modal-header">
                <h2>Delete Chat?</h2>
                <button class="icon-btn close-modal" id="closeDeleteModal">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <line x1="18" y1="6" x2="6" y2="18"/>
                        <line x1="6" y1="6" x2="18" y2="18"/>
                    </svg>
                </button>
            </div>
            <div class="modal-body">
                <p class="delete-warning">This action cannot be undone. Are you sure you want to delete this chat?</p>
                <div class="form-actions">
                    <button class="cancel-btn" id="cancelDelete">Cancel</button>
                    <button class="delete-confirm-btn" id="confirmDelete">Delete</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Model Dropdown Menu (global) -->
    <div class="model-dropdown-menu" id="modelDropdownMenu"></div>

    <!-- Donate Popup -->
    <div class="donate-overlay active" id="donateOverlay">
        <div class="donate-popup">
            <button class="donate-close" id="donateClose">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <line x1="18" y1="6" x2="6" y2="18"/>
                    <line x1="6" y1="6" x2="18" y2="18"/>
                </svg>
            </button>
            <div class="donate-content">
                <div class="donate-icon">
                    <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/>
                    </svg>
                </div>
                <h2>Support Nemo</h2>
                <p>Scan QR code to donate</p>
                <div class="qr-container">
                    <img src="https://api.qrserver.com/v1/create-qr-code/?size=300x300&data=upi://pay?pa=g.host@ptyes&pn=Nemo" alt="Donate QR Code" class="donate-qr">
                </div>
                <p class="donate-thanks">Your support keeps Nemo alive!</p>
            </div>
        </div>
    </div>

    <!-- Donate Button -->
    <button class="donate-float-btn" id="donateBtn">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/>
        </svg>
        <span>Donate</span>
    </button>

    <script src="script.js"></script>
</body>
</html>
